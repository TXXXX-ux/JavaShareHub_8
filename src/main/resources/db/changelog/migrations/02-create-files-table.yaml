databaseChangeLog:
  - changeSet:
      id: 2
      author: tyler
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: storage_path
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: unique_key
                  type: VARCHAR(255)
              - column:
                  name: download_count
                  type: INT
                  defaultValueNumeric: 0
              - column:
                  name: category
                  type: VARCHAR(100)
              - column:
                  name: uploader_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_files_user
                    references: users(id)