server:
  port: 8089

spring:
  application:
    name: JavaShareHub
  servlet:
    multipart:
      max-request-size: 30MB
      max-file-size: 25MB
  datasource:
    url: jdbc:h2:./db/JavaShareHub;AUTO_SERVER=TRUE
    username: admin
    password: 123
    driver-class-name: org.h2.Driver
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
  mail:
    host: smtp.gmail.com
    username:
    password:
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  file:
    path: logs
  level:
    org.springframework.security: DEBUG
    kg.attractor.JavaShareHub: DEBUG
    org.springframework.jdbc: DEBUG
    org.springframework.transaction: DEBUG
    kg.attractor.javasharehub: DEBUG
    com.zaxxer.hikari: error
    org.apache.tomcat: error
    liquibase: error
    root: info
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"